<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>The Dusty Page — Vintage Bookshop</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="css/style.css"/>
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="index.html">📚 The Dusty Page</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navMenu">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="shop.html">Browse Books</a></li>
            </ul>
            <div class="d-flex align-items-center gap-3">
                <a href="cart.html" class="btn btn-outline-light btn-sm">
                    🛒 Cart <span id="cartCount" class="badge bg-danger">0</span>
                </a>
                <div id="authLinks">
                    <a href="login.html" class="btn btn-outline-light btn-sm">Sign In</a>
                </div>
            </div>
        </div>
    </div>
</nav>

<!-- HERO -->
<section class="hero-section py-5 text-white text-center">
    <div class="container py-5">
        <h1 class="display-4 fw-bold">Every Book Has a Story</h1>
        <p class="lead mt-3">Curated vintage and second-hand books, lovingly sourced from collections across the country.</p>
        <a href="shop.html" class="btn btn-light btn-lg mt-3">Browse Collection</a>
    </div>
</section>

<!-- FEATURED BOOKS -->
<section class="py-5">
    <div class="container">
        <h2 class="mb-4">Featured Books</h2>
        <div class="row g-4" id="booksGrid">
            <p class="text-muted">Loading books...</p>
        </div>
        <div class="text-center mt-4">
            <a href="shop.html" class="btn btn-dark">View All Books</a>
        </div>
    </div>
</section>

<!-- FOOTER -->
<footer class="bg-dark text-white py-4 mt-5">
    <div class="container text-center">
        <p class="mb-0">© 2024 The Dusty Page — Vintage Bookshop</p>
    </div>
</footer>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script>
    // Update navbar based on login status
    function updateNav() {
        const token = localStorage.getItem('token');
        const name = localStorage.getItem('userName');
        const authLinks = document.getElementById('authLinks');
        if (token) {
            authLinks.innerHTML = `
                <span class="text-white me-2">Hi, ${name}</span>
                <a href="orders.html" class="btn btn-outline-light btn-sm me-2">My Orders</a>
                <button onclick="logout()" class="btn btn-outline-danger btn-sm">Logout</button>`;
        }
    }

    // Load featured books from backend
    async function loadBooks() {
        try {
            const books = await getAllProducts();
            const grid = document.getElementById('booksGrid');
            grid.innerHTML = books.slice(0, 8).map(book => `
                <div class="col-6 col-md-3">
                    <div class="card h-100 book-card" onclick="window.location.href='product.html?id=${book.id}'">
                        <img src="${book.imageUrl}" class="card-img-top book-cover" alt="${book.title}"/>
                        <div class="card-body">
                            <h6 class="card-title">${book.title}</h6>
                            <p class="text-muted small">${book.author}</p>
                            <p class="fw-bold">£${book.price}</p>
                            <button class="btn btn-dark btn-sm w-100"
                                onclick="event.stopPropagation(); addToCart({id:${book.id}, title:'${book.title.replace(/'/g,"\\'")}', price:${book.price}, imageUrl:'${book.imageUrl}'})">
                                Add to Cart
                            </button>
                        </div>
                    </div>
                </div>`).join('');
            updateCartCount();
        } catch (e) {
            document.getElementById('booksGrid').innerHTML = '<p class="text-danger">Could not load books.</p>';
        }
    }

    updateNav();
    loadBooks();
</script>
</body>
</html>
