<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Book Details — The Dusty Page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="css/style.css"/>
</head>
<body>

<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="index.html">?? The Dusty Page</a>
        <div class="d-flex align-items-center gap-3 ms-auto">
            <a href="cart.html" class="btn btn-outline-light btn-sm">
                ?? Cart <span id="cartCount" class="badge bg-danger">0</span>
            </a>
            <div id="authLinks">
                <a href="login.html" class="btn btn-outline-light btn-sm">Sign In</a>
            </div>
        </div>
    </div>
</nav>

<div class="container py-5" id="productContent">
    <div class="text-center py-5">
        <div class="spinner-border text-dark"></div>
        <p class="mt-2 text-muted">Loading book...</p>
    </div>
</div>

<footer class="bg-dark text-white py-4 mt-5">
    <div class="container text-center">
        <p class="mb-0">© 2024 The Dusty Page</p>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script>
    function updateNav() {
        const token = localStorage.getItem('token');
        const name = localStorage.getItem('userName');
        const authLinks = document.getElementById('authLinks');
        if (token) {
            authLinks.innerHTML = `<span class="text-white me-2">Hi, ${name}</span>
                <button onclick="logout()" class="btn btn-outline-danger btn-sm">Logout</button>`;
        }
    }

    async function loadProduct() {
        const id = new URLSearchParams(window.location.search).get('id');
        if (!id) { window.location.href = 'shop.html'; return; }

        try {
            const p = await getProductById(id);
            document.title = `${p.title} — The Dusty Page`;
            document.getElementById('productContent').innerHTML = `
                <nav aria-label="breadcrumb" class="mb-4">
                    <ol class="breadcrumb">
                        <li class="breadcrumb-item"><a href="index.html">Home</a></li>
                        <li class="breadcrumb-item"><a href="shop.html">Books</a></li>
                        <li class="breadcrumb-item active">${p.title}</li>
                    </ol>
                </nav>
                <div class="row g-5 align-items-start">
                    <div class="col-md-4 text-center">
                        <img src="${p.imageUrl}" alt="${p.title}"
                             style="max-height:450px;object-fit:contain;border-radius:4px;box-shadow:8px 12px 40px rgba(0,0,0,0.2)"
                             class="img-fluid"/>
                    </div>
                    <div class="col-md-8">
                        <span class="badge bg-secondary mb-2">${p.category || 'General'}</span>
                        <span class="badge bg-dark mb-2">${p.condition || 'Good'}</span>
                        <h1 style="font-family:'Playfair Display',serif">${p.title}</h1>
                        <p class="text-muted fst-italic">by ${p.author || 'Unknown'}</p>
                        <h2 style="font-family:'Playfair Display',serif;color:#8b2020">£${parseFloat(p.price).toFixed(2)}</h2>
                        <p class="mt-3" style="line-height:1.8">${p.description || 'A wonderful vintage find.'}</p>
                        <div class="d-flex gap-3 mt-4">
                            <input type="number" id="qty" value="1" min="1" max="10"
                                   class="form-control" style="width:80px"/>
                            <button class="btn btn-dark px-5" onclick="addBook(${p.id}, '${p.title.replace(/'/g,"\\'")}', ${p.price}, '${p.imageUrl}')">
                                Add to Cart
                            </button>
                            <a href="cart.html" class="btn btn-outline-secondary">View Cart</a>
                        </div>
                        <div class="mt-4 p-3 rounded bg-light">
                            <small class="text-muted">
                                ?? Free delivery on orders over £25 &nbsp;·&nbsp;
                                ?? 14-day returns
                            </small>
                        </div>
                    </div>
                </div>`;
        } catch (e) {
            document.getElementById('productContent').innerHTML =
                '<p class="text-muted text-center">Book not found. <a href="shop.html">Browse all books</a></p>';
        }
    }

    function addBook(id, title, price, imageUrl) {
        const qty = parseInt(document.getElementById('qty').value) || 1;
        for (let i = 0; i < qty; i++) {
            addToCart({ id, title, price, imageUrl });
        }
    }

    updateNav();
    loadProduct();
    updateCartCount();
</script>
</body>
</html>
