<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>My Orders — The Dusty Page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="css/style.css"/>
</head>
<body>

<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="index.html">?? The Dusty Page</a>
        <div class="d-flex gap-2 ms-auto">
            <a href="shop.html" class="btn btn-outline-light btn-sm">Browse Books</a>
            <button onclick="logout()" class="btn btn-outline-danger btn-sm">Logout</button>
        </div>
    </div>
</nav>

<div class="container py-5">
    <h2 class="mb-4" style="font-family:'Playfair Display',serif">My Orders</h2>
    <div id="ordersContent">
        <div class="text-center py-5">
            <div class="spinner-border text-dark"></div>
            <p class="mt-2 text-muted">Loading orders...</p>
        </div>
    </div>
</div>

<footer class="bg-dark text-white py-4 mt-5">
    <div class="container text-center">
        <p class="mb-0">© 2024 The Dusty Page</p>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script>
    if (!isLoggedIn()) window.location.href = 'login.html';

    async function loadOrders() {
        const container = document.getElementById('ordersContent');
        try {
            const orders = await getMyOrders();
            if (!orders.length) {
                container.innerHTML = `
                    <div class="text-center py-5">
                        <p style="font-size:3rem">??</p>
                        <h5>No orders yet</h5>
                        <a href="shop.html" class="btn btn-dark mt-3">Start Shopping</a>
                    </div>`;
                return;
            }
            container.innerHTML = orders.map(o => `
                <div class="card mb-3 p-4">
                    <div class="d-flex justify-content-between align-items-start">
                        <div>
                            <h6 style="font-family:'Playfair Display',serif">Order #${o.id}</h6>
                            <small class="text-muted">${new Date(o.createdAt).toLocaleDateString('en-GB', {day:'numeric', month:'long', year:'numeric'})}</small>
                        </div>
                        <div class="text-end">
                            <span class="badge bg-dark">${o.status}</span>
                            <div class="fw-bold mt-1">£${parseFloat(o.total).toFixed(2)}</div>
                        </div>
                    </div>
                </div>`).join('');
        } catch (e) {
            container.innerHTML = '<div class="alert alert-danger">Could not load orders.</div>';
        }
    }

    loadOrders();
</script>
</body>
</html>
