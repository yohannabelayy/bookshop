<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Your Cart — The Dusty Page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="css/style.css"/>
</head>
<body>

<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="index.html">?? The Dusty Page</a>
        <div class="d-flex gap-2 ms-auto">
            <a href="shop.html" class="btn btn-outline-light btn-sm">Browse Books</a>
            <div id="authLinks">
                <a href="login.html" class="btn btn-outline-light btn-sm">Sign In</a>
            </div>
        </div>
    </div>
</nav>

<div class="container py-5">
    <h2 class="mb-4" style="font-family:'Playfair Display',serif">Your Cart</h2>
    <div class="row g-4">
        <div class="col-lg-8" id="cartItems"></div>
        <div class="col-lg-4">
            <div class="card p-4">
                <h5 style="font-family:'Playfair Display',serif">Order Summary</h5>
                <div class="d-flex justify-content-between mb-2">
                    <span>Subtotal</span>
                    <span id="subtotal">£0.00</span>
                </div>
                <hr/>
                <div class="d-flex justify-content-between fw-bold mb-4">
                    <span>Total</span>
                    <span id="total">£0.00</span>
                </div>
                <button class="btn btn-dark w-100" onclick="goToCheckout()">Proceed to Checkout</button>
                <a href="shop.html" class="btn btn-outline-secondary w-100 mt-2">Continue Shopping</a>
            </div>
        </div>
    </div>
</div>

<footer class="bg-dark text-white py-4 mt-5">
    <div class="container text-center">
        <p class="mb-0">© 2024 The Dusty Page</p>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script>
    function updateNav() {
        const token = localStorage.getItem('token');
        const name = localStorage.getItem('userName');
        const authLinks = document.getElementById('authLinks');
        if (token) {
            authLinks.innerHTML = `<span class="text-white me-2">Hi, ${name}</span>
                <button onclick="logout()" class="btn btn-outline-danger btn-sm">Logout</button>`;
        }
    }

    function renderCart() {
        const items = getCart();
        const container = document.getElementById('cartItems');
        const subtotal = getCartTotal();
        document.getElementById('subtotal').textContent = `£${subtotal}`;
        document.getElementById('total').textContent = `£${subtotal}`;

        if (!items.length) {
            container.innerHTML = `
                <div class="text-center py-5">
                    <p style="font-size:3rem">??</p>
                    <h5>Your cart is empty</h5>
                    <a href="shop.html" class="btn btn-dark mt-2">Browse Books</a>
                </div>`;
            return;
        }

        container.innerHTML = items.map(item => `
            <div class="card mb-3 p-3">
                <div class="d-flex gap-3 align-items-center">
                    <img src="${item.imageUrl}" style="width:60px;height:90px;object-fit:cover;border-radius:4px"/>
                    <div class="flex-grow-1">
                        <h6 class="mb-1">${item.title}</h6>
                        <p class="text-muted small mb-0">£${item.price} each</p>
                        <div class="d-flex align-items-center gap-2 mt-2">
                            <button class="btn btn-sm btn-outline-secondary" onclick="changeQty(${item.id}, ${item.quantity - 1})">-</button>
                            <span>${item.quantity}</span>
                            <button class="btn btn-sm btn-outline-secondary" onclick="changeQty(${item.id}, ${item.quantity + 1})">+</button>
                        </div>
                    </div>
                    <div class="text-end">
                        <div class="fw-bold">£${(item.price * item.quantity).toFixed(2)}</div>
                        <button class="btn btn-sm btn-link text-danger" onclick="removeItem(${item.id})">Remove</button>
                    </div>
                </div>
            </div>`).join('');
    }

    function changeQty(id, qty) {
        if (qty < 1) { removeItem(id); return; }
        const cart = getCart();
        const item = cart.find(i => i.id === id);
        if (item) { item.quantity = qty; saveCart(cart); }
        renderCart();
    }

    function removeItem(id) {
        removeFromCart(id);
        renderCart();
    }

    function goToCheckout() {
        if (!getCart().length) { alert('Your cart is empty!'); return; }
        if (!isLoggedIn()) { window.location.href = 'login.html'; return; }
        window.location.href = 'checkout.html';
    }

    updateNav();
    renderCart();
</script>
</body>
</html>
