<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Sign In — The Dusty Page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="css/style.css"/>
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="index.html">?? The Dusty Page</a>
    </div>
</nav>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow p-4">
                <h3 class="text-center mb-4" style="font-family:'Playfair Display',serif">Sign In</h3>
                <div id="errorMsg" class="alert alert-danger d-none"></div>
                <div class="mb-3">
                    <label class="form-label">Email address</label>
                    <input type="email" class="form-control" id="email" placeholder="jane@example.com"/>
                </div>
                <div class="mb-4">
                    <label class="form-label">Password</label>
                    <input type="password" class="form-control" id="password" placeholder="••••••••"/>
                </div>
                <button class="btn btn-dark w-100" onclick="doLogin()" id="loginBtn">Sign In</button>
                <p class="text-center mt-3 text-muted small">
                    No account? <a href="signup.html">Create one</a>
                </p>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script>
    if (isLoggedIn()) window.location.href = 'index.html';

    async function doLogin() {
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const errEl = document.getElementById('errorMsg');
        const btn = document.getElementById('loginBtn');

        errEl.classList.add('d-none');

        if (!email || !password) {
            errEl.textContent = 'Please fill in all fields.';
            errEl.classList.remove('d-none');
            return;
        }

        btn.disabled = true;
        btn.textContent = 'Signing in...';

        try {
            const data = await login(email, password);
            localStorage.setItem('token', data.token);
            localStorage.setItem('userName', data.name);
            localStorage.setItem('userEmail', data.email);
            window.location.href = 'index.html';
        } catch (e) {
            errEl.textContent = 'Invalid email or password.';
            errEl.classList.remove('d-none');
            btn.disabled = false;
            btn.textContent = 'Sign In';
        }
    }
</script>
</body>
</html>
